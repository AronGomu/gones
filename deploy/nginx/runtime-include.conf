# The real server block is rendered from /etc/nginx/gones/default.conf.template into this tmpfs
# directory at container start (C44), because the image runs with a read-only root filesystem and the
# API origin is injected at runtime. A wildcard include never fails on an empty directory, so a
# container started with a broken entrypoint serves nothing instead of serving stale configuration.
include /tmp/gones-nginx/*.conf;
