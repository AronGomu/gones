# Shared-host-only main config. Preserve the image's rendered runtime server include.
# Auth/invitation links carry bearer tokens in paths/queries: never log raw requests,
# referers or request-bearing errors, including errors before a server is selected.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  keepalive_timeout 65;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  include /etc/nginx/conf.d/*.conf;
}
