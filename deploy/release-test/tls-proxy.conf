# TLS termination + forwarded-header contract for the release rehearsal (C41).
#
# The application container never speaks TLS and never trusts a forwarded header unless it comes from
# this proxy's fixed address (GONES_FORWARDED_PROXIES). Any host-provided proxy that sets these three
# headers satisfies the same contract.
server {
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /certs/tls-proxy.pem;
  ssl_certificate_key /certs/tls-proxy.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 2m;

  # Single public origin: the server-mode SPA and its API share it, so the browser never makes a
  # cross-origin request and the CSP `connect-src` stays 'self'-shaped (C43).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  location /health/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  location / {
    proxy_pass http://frontend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }
}
