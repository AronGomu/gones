<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../style/bulma.css">
	<link rel="stylesheet" href="../style/global.css">
	<link rel="stylesheet" href="edit_league.css">
	<script defer src="../component/GonesTable.js"></script>
	<title>leaguemtg</title>
</head>

<body>
	<div class="container">
		<div id="main-section">

			<nav class="breadcrumb is-large has-succeeds-separator" aria-label="breadcrumbs">
				<ul>
					<!-- <li id="nav-menu"><a href="#">Menu</a></li> -->
					<li id="nav-leagues"><a href="#">Leagues</a></li>
					<li id="nav-league" class="is-active"><a href="#" aria-current="page">League ???</a></li>
				</ul>
				<hr>
			</nav>

			<div id="title-section">
				<h1 id="h1" class="title is-1 modifiable-h1 has-text-centered">Insert League Name</h1>
				<div id="name" class="field" hidden="true">
					<input id="name-input" class="input is-large" type="text" placeholder="League Name">
				</div>
			</div>

			<div id="date-section" class="is-flex is-flex-direction-row is-justify-content-space-around">
				<div class="field">
					<label class="label is-medium" for="start">Start Date</label>
					<input class="input is-medium" type="date" id="start">
				</div>
			
				<div class="field">
					<label class="label is-medium" for="end">End Date</label>
					<input class="input is-medium" type="date" id="end">
				</div>
			</div>

			<hr>

			<div id="tournaments-table-container">
				<h2 class="title is-2 has-text-centered">Tournaments</h2>
				<gones-table id="tournaments-table"></gones-table>
				<div id="create-tournament-button-container" class="is-flex is-justify-content-space-around m-4">
					<button type="button" id="create-tournament-button" class="button is-large is-primary is-dark">Add Tournament</button>
				</div>
			</div>

			<hr>

			<div id="standings-table-container" >
				<h2 class="title is-2 has-text-centered">Standings</h2>
				<gones-table id="standings-table"></gones-table>
			</div>
		</div>
		
		<div id="footer-section" class="is-flex is-justify-content-space-around m-4">
			<button id="to-leagues-button" class="button is-large is-neutral is-dark">To Leagues</button>
			<button id="delete-league-button" class="button is-large is-danger is-dark">Delete League</button>
		</div>

	</div>
		
</body>

<script type="module"src="./edit_league.js"></script>
</html>
