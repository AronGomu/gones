# Isolated local validation only. Not a production or provider-cost approval.
# Merge with compose.yaml; the base owns private volume bootstrap and RO/RW mounts.
services:
  api:
    environment:
      GONES_WORKER_IDLE_MODE: "true"
      GONES_WORKER_HEALTH_PATH: /run/gones-worker/health.json
  worker:
    environment:
      GONES_WORKER_IDLE_MODE: "true"
      GONES_WORKER_HEALTH_PATH: /run/gones-worker/health.json
    healthcheck:
      test: ["CMD", "dotnet", "Gones.Worker.dll", "--health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
