<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../style/bulma.css">
	<link rel="stylesheet" href="../style/global.css">
	<link rel="stylesheet" href="edit_tournament.css">
	<script defer src="../component/GonesTable.js"></script>
	<title>Edit Tournament</title>
</head>

<body>
	<div class="container">
		<div id="main-section">

			<nav class="breadcrumb is-large has-succeeds-separator" aria-label="breadcrumbs">
				<ul>
					<!-- <li id="nav-menu"><a href="#">Menu</a></li> -->
					<li id="nav-leagues"><a href="#">Leagues</a></li>
					<li id="nav-league" ><a href="#">League ???</a></li>
					<li id="nav-tournament" class="is-active"><a href="#" aria-current="page">Tournament ???</a></li>
				</ul>
				<hr>
			</nav>

			<div id="title-section">
				<h1 id="h1" class="title is-1 modifiable-h1 has-text-centered">Insert Tournament Name</h1>
				<div id="name" class="field" hidden="true">
					<input id="name-input" class="input" type="text" placeholder="Tournament Name">
				</div>
			</div>
			
			<div class="field is-flex">
				<label class="label is-medium mr-4 is-align-content-center" for="tournament-date">Tournament Date</label>
				<div>
					<input class="input is-medium" type="date" id="tournament-date-input">
				</div>
			</div>

			<hr>
			
			<div id="standings-table-container" >
				<h2 id="standings-h2" class="title is-2 has-text-centered">Standings</h2>
				<gones-table id="standings-table"></gones-table>

				<div id="import-div" class="is-flex is-flex-direction-column is-justify-content-space-around mt-4">
					<div class="is-flex m-2">
						<!-- <label>Load tournament from Spicerack Event</label> -->
						<input type="text" id="url_input" placeholder="Spicerack Event URL" class="input is-large mr-4">
						<button type="button" id="start_scrapping_button"
							class="button is-large is-primary is-dark"
						>Import</button>
					</div>
					
					<div class="is-flex is-justify-content-center">
						<button type="button" id="start_scrapping_button" disabled
							class="button is-large is-secondary is-dark"
						>Load tournament from CSV</button>
					</div>
				</div>
			</div>

			
			<div id="footer-section" class="is-flex is-justify-content-space-around m-4">
				<button id="to-league-button" class="button is-large is-neutral is-dark">Return to League</button>
				<button id="delete-tournament-button" class="button is-large is-danger is-dark">Delete Tournament</button>
			</div>
			
			
		</div>
	</div>
</body>

<script type="module"src="./edit_tournament.js"></script>
</html>
