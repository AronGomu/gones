<!DOCTYPE html>
<html lang="en">
<head>

		<span id="nav-leagues" class="nav-clickable"></span>
		<span id="nav-league" class="nav-current"></span>
	</div>

	<h1>Edit League : <span id="id"></span></h1>

	<h2>League Info</h2>
	<div class="league_fields_container">

			<label for="name">Name</label>
			<input type="text" id="name">

		<div class="league_field">
			<label for="start">Start Date</label>
			<input type="date" id="start">
		</div>
	
		<div class="league_field">
			<label for="end">End Date</label>
			<input type="date" id="end">
		</div>
	</div>

	<h2>Tournaments</h2>
	<gones-table id="tournaments_table"></gones-table>
	<button type="button" id="create_tournament_button">Add Tournament</button>

	<h2>Ranking</h2>
	<gones-table id="standings_table"></gones-table>
