<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gones - Leagues</title>
    <link rel="stylesheet" href="../styles/tailwind.css">
  </head>
  <body class="app-shell">
    <header class="app-header">
      <div class="app-header-left">
        <a class="app-brand" href="leagues.html" aria-label="Gones home"><img src="../assets/gones_logo.png" alt="Gones" class="app-brand-logo"></a>
        <nav class="app-breadcrumb" aria-label="Breadcrumb" data-cy="breadcrumb">
          <span class="breadcrumb-current" data-cy="breadcrumb-current">Leagues</span>
        </nav>
      </div>
      <div class="app-header-actions">
        <label class="button-secondary min-h-10 px-3 text-sm focus-within:outline focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-[oklch(67%_0.17_29)]">
          <input class="pointer-events-none absolute h-px w-px opacity-0" type="file" accept=".json,application/json" data-action="restore" data-cy="restore-league">
          Import League
        </label>
        <button class="button-create min-h-12 px-4 text-base" type="button" data-action="open-create-dialog" data-cy="open-create-league">New League</button>
      </div>
    </header>
    <main class="app-main-wide">
      <section class="grid gap-2">
        <h1 class="page-title">Leagues</h1>
      </section>

      <section id="featured-league-section" class="grid gap-3" aria-labelledby="current-league-title"></section>

      <section class="grid gap-4" aria-labelledby="all-leagues-title">
        <div class="grid gap-3 sm:grid-cols-[minmax(0,1fr)_minmax(220px,320px)] sm:items-end">
          <div>
            <h2 id="all-leagues-title" class="section-title">All leagues</h2>
            <p class="muted-copy mt-1">Open a League to review standings, add Tournaments, or manage source data.</p>
          </div>
          <label class="grid gap-1 text-sm font-semibold text-ash">
            Search
            <input id="league-search" class="field min-h-10 px-3" type="search" placeholder="Filter leagues">
          </label>
        </div>
        <div id="league-list" data-cy="league-list"></div>
      </section>
    </main>
    <div id="create-league-dialog" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="create-league-title">
      <form id="create-league-form" class="modal-panel">
        <div class="section-header">
          <div>
            <h2 id="create-league-title" class="section-title">New League</h2>
            <p class="muted-copy mt-1">Create a League, then add Tournaments from its page.</p>
          </div>
          <button class="button-secondary min-h-[34px] px-2 py-1" type="button" data-action="close-create-dialog" aria-label="Close new league dialog">x</button>
        </div>
        <label class="grid gap-1 text-sm font-semibold text-ash">
          League name
          <input id="new-league-name" class="field min-h-11 px-3" name="name" data-cy="league-name-input" placeholder="Legacy Sundays" required>
        </label>
        <div class="flex flex-wrap justify-end gap-2">
          <button class="button-secondary" type="button" data-action="close-create-dialog">Cancel</button>
          <button class="button-create" type="submit" data-cy="create-league">Create League</button>
        </div>
      </form>
    </div>
    <p class="sr-only" id="restore-status" data-cy="restore-status" aria-live="polite"></p>
    <script type="module" src="./leagues.js"></script>
  </body>
</html>
