name: Cloudflare Pages build check

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload Angular dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: gones-dist
          path: dist/gones/browser
