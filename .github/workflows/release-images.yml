name: Release images

# Registry-neutral artifact build (C41).
#
# Produces the linux/amd64 release images, their immutable digests, SBOMs, checksums and security
# scan reports as workflow artifacts. Nothing is pushed: choosing a registry is deferred with the
# rest of the hosting decision, so this pipeline deliberately stops at "verified local artifact".

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Dockerfile'
      - 'backend/src/**/Dockerfile'
      - 'deploy/**'
      - 'compose*.yaml'
      - 'scripts/*release*'
      - 'scripts/scan-images.mjs'
      - 'scripts/verify-image-contract.mjs'
      - 'ops/**'
      - '.github/workflows/release-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reserved for future keyless signing against an OIDC-enabled registry.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: docker/setup-buildx-action@v3

      - run: npm ci

      # Static contract over the build files, before anything is built.
      - name: Verify image and host contract
        run: npx vitest run ops

      - name: Build release images
        env:
          GONES_IMAGE_PLATFORM: linux/amd64
        run: npm run images:build

      - name: Verify built image contract
        env:
          GONES_IMAGE_PLATFORM: linux/amd64
        run: npm run images:verify

      # trivy for image vulnerabilities, gitleaks for secrets. Both run as digest-pinned containers,
      # so the local command and the CI command are the same command.
      - name: Scan images and working tree
        run: npm run images:scan

      # Artifacts: image digests, sbom (SPDX), checksums, trivy and gitleaks reports.
      - name: Upload digests, sbom, checksums and scan reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-image-provenance
          path: reports/images/
          if-no-files-found: warn

      # Signing hook. Disabled until a registry with OIDC trust exists; it never runs with a private
      # key, and no registry host is configured anywhere in this repository.
      - name: Install cosign
        if: ${{ vars.GONES_SIGN_IMAGES == 'true' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign published digests (keyless, OIDC)
        if: ${{ vars.GONES_SIGN_IMAGES == 'true' }}
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          # Placeholder for the future publish step: once images are pushed to a registry chosen by
          # the deferred hosting decision, sign each pushed digest keylessly with the workflow's OIDC
          # identity. Until then there is nothing to sign, so the step is a documented no-op.
          echo "cosign is installed; signing runs once a registry target exists."
          cosign version
