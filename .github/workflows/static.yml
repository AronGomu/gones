name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run api:check
      - run: dotnet test backend/Gones.sln --configuration Release
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Runs after `build` so the client-bundle secret scan has a `dist/` to read.
      - run: npm run audit:supply-chain
      - name: Upload quality-gate reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-gate-reports
          path: reports/
          if-no-files-found: warn

  full-stack:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run e2e:ci
