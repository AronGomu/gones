name: Promote tested candidate to main

# Manual handoff only. No merge, push, image build or production deploy.
# Required reviewers/branch restrictions on the production environment are external prerequisites.
on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful first-attempt staging finalization run ID from this repository
        required: true
        type: string
      staging_artifact_id:
        description: Immutable staging-promotion-evidence artifact ID from that run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: gones-production-handoff
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Retrieve authenticated staging evidence and revalidate immutable handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          STAGING_ARTIFACT_ID: ${{ inputs.staging_artifact_id }}
          GONES_PRODUCTION_CONFIG_REVISION: ${{ vars.GONES_PRODUCTION_CONFIG_REVISION }}
        run: node scripts/production-handoff.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: production-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/production/handoff.json
          if-no-files-found: error
          retention-days: 7
