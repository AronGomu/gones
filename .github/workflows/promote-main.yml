name: Promote tested candidate to main

# Manual gate only. It performs no merge, push or production deploy. Branch protection remains the
# authority for merging; this check proves main has the staged tree/config and exact digest manifest.
on:
  workflow_dispatch:
    inputs:
      evidence_json:
        description: JSON emitted by the successful staging promotion job
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Prepare supplied staging evidence
        env:
          EVIDENCE_JSON: ${{ inputs.evidence_json }}
        run: |
          mkdir -p reports/staging
          node -e "require('node:fs').writeFileSync('reports/staging/evidence.json', process.env.EVIDENCE_JSON + '\\n')"
      - name: Require unchanged main tree/config and tested digests
        run: |
          current_tree=$(git rev-parse HEAD^{tree})
          node -e "const fs=require('node:fs'); const p='reports/staging/evidence.json'; const e=JSON.parse(fs.readFileSync(p)); e.current={tree:process.argv[1],configRevision:e.candidate.configRevision}; fs.writeFileSync(p, JSON.stringify(e)+'\\n')" "$current_tree"
          npm run release:promotion-check -- --evidence=reports/staging/evidence.json
