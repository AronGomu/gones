name: gones

x-dotnet-runtime: &dotnet-runtime
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=32m,mode=1777"]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gones
      POSTGRES_USER: gones_migration
      POSTGRES_PASSWORD: local-migration-only
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gones_migration -d gones"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrator:
    build:
      context: .
      dockerfile: backend/src/Gones.Migrator/Dockerfile
    command: ["database", "update"]
    environment:
      # Npgsql negotiates GSS encryption by default; the runtime image ships no libgssapi_krb5, so the
      # probe only prints a load error before falling back. Nothing here uses Kerberos.
      GONES_DB_CONNECTION: Host=postgres;Port=5432;Database=gones;Username=gones_migration;Password=local-migration-only;Gss Encryption Mode=Disable
      GONES_ALLOW_TEST_NOTIFICATION: "true"
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"

  permissions:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: local-migration-only
    command:
      - sh
      - -ec
      - |
        psql -h postgres -U gones_migration -d gones -v ON_ERROR_STOP=1 <<'SQL'
        GRANT USAGE ON SCHEMA public TO gones_app;
        GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO gones_app;
        GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO gones_app;
        REVOKE UPDATE, DELETE, TRUNCATE ON audit_records FROM gones_app;
        -- Revoking the table privilege also drops every column privilege, so the one column a hard
        -- account deletion has to clear is granted back afterwards.
        GRANT UPDATE (actor_id) ON audit_records TO gones_app;
        SQL
    depends_on:
      migrator: { condition: service_completed_successfully }
    restart: "no"

  event-image-secret-init:
    image: alpine:3.22
    command:
      - sh
      - -ec
      - |
        umask 077
        test -s /secrets/access-key || head -c 10 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/access-key
        test -s /secrets/secret-key || head -c 20 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/secret-key
        chmod 0444 /secrets/access-key /secrets/secret-key
    volumes:
      - event-image-secrets:/secrets
    read_only: true
    tmpfs: ["/tmp:size=1m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/event-images/access-key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/event-images/secret-key
    volumes:
      - event-image-data:/data
      - event-image-secrets:/run/secrets/event-images:ro
    depends_on:
      event-image-secret-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  event-image-bucket-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      MC_CONFIG_DIR: /tmp/mc
    command:
      - |
        mc alias set local http://minio:9000 "$$(cat /run/secrets/event-images/access-key)" "$$(cat /run/secrets/event-images/secret-key)"
        mc mb --ignore-existing local/gones-event-images
        mc anonymous set none local/gones-event-images
    volumes:
      - event-image-secrets:/run/secrets/event-images:ro
    depends_on:
      minio: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp:size=4m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"

  api:
    <<: *dotnet-runtime
    build:
      context: .
      dockerfile: backend/src/Gones.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GONES_DB_CONNECTION: Host=postgres;Port=5432;Database=gones;Username=gones_app;Password=local-app-only;Gss Encryption Mode=Disable
      GONES_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:8081,http://127.0.0.1:8081
      GONES_ALLOW_TEST_NOTIFICATION: "true"
      GONES_FEATURES__AUTH_V1: ${GONES_FEATURES__AUTH_V1:-false}
      GONES_FEATURES__ADMIN_V1: ${GONES_FEATURES__ADMIN_V1:-false}
      GONES_AUTH_PROVIDER: ${GONES_AUTH_PROVIDER:-Local}
      GONES_AUTH_RATE_LIMIT_PERMIT_LIMIT: ${GONES_AUTH_RATE_LIMIT_PERMIT_LIMIT:-}
      GONES_RATE_LIMIT_WRITE_PERMIT_LIMIT: ${GONES_RATE_LIMIT_WRITE_PERMIT_LIMIT:-}
      GONES_RATE_LIMIT_AUTHENTICATED_READ_PERMIT_LIMIT: ${GONES_RATE_LIMIT_AUTHENTICATED_READ_PERMIT_LIMIT:-}
      GONES_RATE_LIMIT_ADMIN_PERMIT_LIMIT: ${GONES_RATE_LIMIT_ADMIN_PERMIT_LIMIT:-}
      GONES_AUTH_SIGNING_KEY: ${GONES_AUTH_SIGNING_KEY:-local-development-only-signing-key-change-me}
      GONES_PUBLIC_APP_ORIGIN: ${GONES_PUBLIC_APP_ORIGIN:-https://localhost:4200}
      GONES_OAUTH_CALLBACK_ORIGIN: ${GONES_OAUTH_CALLBACK_ORIGIN:-}
      GONES_GOOGLE_CLIENT_ID: ${GONES_GOOGLE_CLIENT_ID:-}
      GONES_GOOGLE_CLIENT_SECRET: ${GONES_GOOGLE_CLIENT_SECRET:-}
      GONES_GOOGLE_CLIENT_SECRET_FILE: ${GONES_GOOGLE_CLIENT_SECRET_FILE:-}
      GONES_EVENT_IMAGES_S3_ENDPOINT: http://minio:9000
      GONES_EVENT_IMAGES_S3_BUCKET: gones-event-images
      GONES_EVENT_IMAGES_S3_REGION: us-east-1
      GONES_EVENT_IMAGES_S3_ACCESS_KEY_FILE: /run/secrets/event-images/access-key
      GONES_EVENT_IMAGES_S3_SECRET_KEY_FILE: /run/secrets/event-images/secret-key
      GONES_FACEBOOK_CLIENT_ID: ${GONES_FACEBOOK_CLIENT_ID:-}
      GONES_FACEBOOK_CLIENT_SECRET: ${GONES_FACEBOOK_CLIENT_SECRET:-}
      GONES_FACEBOOK_CLIENT_SECRET_FILE: ${GONES_FACEBOOK_CLIENT_SECRET_FILE:-}
      # Plain-http dev host: a Secure cookie is silently dropped, so the session never survives a reload (ADR 0029).
      GONES__AUTH__REFRESHCOOKIE__SAMESITE: ${GONES__AUTH__REFRESHCOOKIE__SAMESITE:-Lax}
      GONES__AUTH__REFRESHCOOKIE__SECURE: ${GONES__AUTH__REFRESHCOOKIE__SECURE:-false}
      GONES_OTEL_CONSOLE_EXPORTER: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports: ["127.0.0.1:5080:8080"]
    volumes:
      - event-image-secrets:/run/secrets/event-images:ro
    depends_on:
      permissions: { condition: service_completed_successfully }
      event-image-bucket-bootstrap: { condition: service_completed_successfully }

  worker:
    <<: *dotnet-runtime
    build:
      context: .
      dockerfile: backend/src/Gones.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      GONES_DB_CONNECTION: Host=postgres;Port=5432;Database=gones;Username=gones_app;Password=local-app-only;Gss Encryption Mode=Disable
      GONES_EMAIL_TRANSPORT: File
      GONES_EMAIL_SINK_PATH: /tmp/gones-email-sink
      GONES_EMAIL_SINK_INCLUDE_ACTION_LINKS: ${GONES_EMAIL_SINK_INCLUDE_ACTION_LINKS:-false}
      GONES_PUBLIC_APP_ORIGIN: ${GONES_PUBLIC_APP_ORIGIN:-https://localhost:4200}
      GONES_EVENT_IMAGES_S3_ENDPOINT: http://minio:9000
      GONES_EVENT_IMAGES_S3_BUCKET: gones-event-images
      GONES_EVENT_IMAGES_S3_REGION: us-east-1
      GONES_EVENT_IMAGES_S3_ACCESS_KEY_FILE: /run/secrets/event-images/access-key
      GONES_EVENT_IMAGES_S3_SECRET_KEY_FILE: /run/secrets/event-images/secret-key
      GONES_NOTIFICATION_POLL_MILLISECONDS: "500"
      GONES_OTEL_CONSOLE_EXPORTER: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - event-image-secrets:/run/secrets/event-images:ro
    depends_on:
      permissions: { condition: service_completed_successfully }
      event-image-bucket-bootstrap: { condition: service_completed_successfully }

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # The API database is the single data authority (ADR 0020). A missing or incoherent declaration
  # fails the image build, and then app startup — there is no browser store left to fall back to.
  frontend-development:
    build:
      context: .
      target: development
      args:
        GONES_FRONTEND_DATA_MODE: ${GONES_FRONTEND_DATA_MODE:-server}
        GONES_FRONTEND_AUTH_V1: ${GONES_FRONTEND_AUTH_V1:-false}
        GONES_FRONTEND_ADMIN_V1: ${GONES_FRONTEND_ADMIN_V1:-false}
        # No colon: an explicitly empty value is honoured, so the legacy profile really has no API.
        GONES_FRONTEND_API_BASE_URL: ${GONES_FRONTEND_API_BASE_URL-http://127.0.0.1:5080}
    read_only: true
    tmpfs:
      - /app/.angular:size=32m
      - /tmp:size=16m
    ports: ["127.0.0.1:4200:4200"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      api: { condition: service_healthy }

  frontend-release:
    profiles: [release]
    build:
      context: .
      target: release
      args:
        GONES_FRONTEND_DATA_MODE: ${GONES_FRONTEND_DATA_MODE:-server}
        GONES_FRONTEND_AUTH_V1: ${GONES_FRONTEND_AUTH_V1:-false}
        GONES_FRONTEND_ADMIN_V1: ${GONES_FRONTEND_ADMIN_V1:-false}
        GONES_FRONTEND_API_BASE_URL: ${GONES_FRONTEND_API_BASE_URL-http://127.0.0.1:5080}
    # C44: the same values, injected at container start. The build arguments are only the artifact's
    # defaults; these are what the served bundle and the content-security-policy actually use.
    environment:
      GONES_DATA_MODE: ${GONES_DATA_MODE:-server}
      GONES_API_BASE_URL: ${GONES_API_BASE_URL-http://127.0.0.1:5080}
      GONES_AUTH_V1: ${GONES_AUTH_V1:-false}
      GONES_ADMIN_V1: ${GONES_ADMIN_V1:-false}
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=8m
    ports: ["127.0.0.1:8081:8080"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      api: { condition: service_healthy }

volumes:
  event-image-data:
  event-image-secrets:
  postgres-data:
